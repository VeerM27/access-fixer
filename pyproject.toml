[project]
name = "access-fixer"
version = "0.1.0"
description = "An ADK agent that audits a static site for WCAG 2.2 AA issues and opens a pull request with fixes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[mcp,eval]>=2.12,<3",
    "playwright==1.63.*",
    "axe-playwright-python>=0.1.8",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
